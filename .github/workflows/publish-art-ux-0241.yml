name: Apply and verify art UX 0241
on:
  push:
    branches: [fix/art-ux-audit-0241]
    paths: [.github/workflows/publish-art-ux-0241.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/workflows/
            /.github/audit-0241/
            /scripts/
            /scenes/
            /resources/
            /assets/
            /docs/
            /tools/
            /tests/
      - name: Apply reviewed text patch with source and result guards
        run: |
          python3 - <<'PYCODE'
          import os, re, zlib, base64, hashlib, pathlib, subprocess
          assert os.environ['GITHUB_REF_NAME'] == 'fix/art-ux-audit-0241'
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == os.environ['GITHUB_SHA']
          encoded = b''.join(pathlib.Path('.github/audit-0241/patch.'+str(i)).read_bytes().strip() for i in range(4))
          # Repair transport transcription only; the final patch hash remains mandatory.
          encoded = encoded.replace(b'IYHza9YNk', b'IYza9YNk').replace(b'ISTMBU4WQ71', b'ISTMBU4W71')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '54d64eb589b114b7e2513ff1358b725dd26722640da943c1c9d364232e4e7288'
          entries=[]
          for block in patch.decode().split('diff --git ')[1:]:
              header=block.splitlines()[0]
              left,right=header.split(' ')
              assert left[2:]==right[2:]
              path=left[2:]
              assert not pathlib.PurePosixPath(path).is_absolute() and '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('scripts/','scenes/','tests/','tools/','docs/audits/'))
              old,new=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',block,re.M).groups()
              if old == '0'*40:
                  assert not pathlib.Path(path).exists(), path
              else:
                  actual=subprocess.check_output(['git','hash-object',path]).decode().strip()
                  assert actual==old,(path,old,actual)
              entries.append((path,new))
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed.patch'
          temporary.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(temporary)],check=True)
          subprocess.run(['git','apply',str(temporary)],check=True)
          for path,new in entries:
              assert subprocess.check_output(['git','hash-object',path]).decode().strip()==new,path
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed_files.json').write_text(__import__('json').dumps([p for p,_ in entries]))
          print('REVIEWED_TEXT_PATCH_OK',len(entries))
          PYCODE
      - name: Install matching image tools and verified Godot
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          mkdir -p "$RUNNER_TEMP/godot0241"
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot0241/godot.zip"
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt -o "$RUNNER_TEMP/godot0241/sums.txt"
          python3 - <<'PYCODE'
          import os,hashlib,pathlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot0241'
          expected=next(x.split()[0] for x in (p/'sums.txt').read_text().splitlines() if x.split()[-1].lstrip('*')=='Godot_v4.7.2-stable_linux.x86_64.zip')
          assert hashlib.sha512((p/'godot.zip').read_bytes()).hexdigest()==expected
          zipfile.ZipFile(p/'godot.zip').extractall(p)
          (p/'Godot_v4.7.2-stable_linux.x86_64').chmod(0o755)
          PYCODE
      - name: Restore exact reviewed assets, not generated replacements
        run: |
          python3 - <<'PYCODE'
          import os,json,pathlib,subprocess,hashlib
          from PIL import Image,ImageDraw
          root=pathlib.Path.cwd()
          manifest=json.loads((root/'docs/audits/PKG_0241_ASSET_PROVENANCE.json').read_text())
          for item in manifest['lena_cleanup']:
              path=root/item['file']; source=path.read_bytes()
              assert hashlib.sha256(source).hexdigest()==item['source_sha256'],str(path)
              original=Image.open(path).convert('RGBA');im=original.copy()
              name=path.stem
              def erase(boxes,head=None,mint=False):
                  mask=Image.new('L',im.size);draw=ImageDraw.Draw(mask)
                  for box in boxes:draw.rectangle(box,fill=255)
                  if head:
                      keep=Image.new('L',im.size);ImageDraw.Draw(keep).polygon([tuple(x) for x in head],fill=255)
                      for y in range(19,33):
                          for x in range(23,41):
                              if not keep.getpixel((x,y)):mask.putpixel((x,y),255)
                  for y in range(104):
                      for x in range(64):
                          r,g,b,a=im.getpixel((x,y))
                          step=mint and 26<=x<=40 and 60<=y<=95 and g>r*1.13 and g>b*1.05
                          if a and (mask.getpixel((x,y)) or step) and not(r>g*1.15 and r>b*1.2):im.putpixel((x,y),(0,0,0,0))
              erase(item['boxes_inclusive'],mint=name=='board_vehicle_1');im.save(path)
              if 'extra_boxes_inclusive' in item:
                  im=Image.open(path).convert('RGBA');erase(item['extra_boxes_inclusive'],item.get('head_keep_polygon'));im.save(path)
              if 'restore_original_rectangles' in item:
                  im=Image.open(path).convert('RGBA')
                  for x1,y1,x2,y2 in item['restore_original_rectangles']:
                      for y in range(y1,y2+1):
                          for x in range(x1,x2+1):im.putpixel((x,y),original.getpixel((x,y)))
                  im.save(path)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['result_sha256'],('result mismatch',str(path))
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])/'vendor0241';temp.mkdir()
          (temp/'project.godot').write_text('config_version=5\n')
          for item in manifest['vendor']:
              name=pathlib.Path(item['path']).stem
              data=subprocess.check_output(['git','cat-file','blob',item['source_ctex_git_blob_sha']])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['source_ctex_git_blob_sha']
              (temp/(name+'.ctex')).write_bytes(data)
          script='extends SceneTree\nfunc _initialize() -> void:\n\tfor id in ["idle", "listen", "talk_0", "talk_1"]:\n\t\tvar texture := load("res://%s.ctex" % id) as Texture2D\n\t\tif texture == null:\n\t\t\tquit(1)\n\t\t\treturn\n\t\tvar error := texture.get_image().save_png(OS.get_environment("GS_VENDOR_OUTPUT").path_join(id + ".png"))\n\t\tif error != OK:\n\t\t\tquit(1)\n\t\t\treturn\n\tquit(0)\n'
          (temp/'recover.gd').write_text(script)
          target=root/'assets/characters/vendor';target.mkdir(parents=True,exist_ok=True)
          for item in manifest['vendor']:assert not (root/item['path']).exists(),item['path']
          env=os.environ.copy();env.update(GS_VENDOR_OUTPUT=str(target),GODOT_SILENCE_ROOT_WARNING='1')
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot0241/Godot_v4.7.2-stable_linux.x86_64'
          subprocess.run([str(engine),'--headless','--audio-driver','Dummy','--path',str(temp),'--script','res://recover.gd'],env=env,check=True)
          for item in manifest['vendor']:assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['result_sha256'],item['path']
          print('REVIEWED_ASSETS_OK',len(manifest['vendor'])+len(manifest['lena_cleanup']))
          PYCODE
      - name: Commit only reviewed files; remove this one-use publisher
        id: commit
        run: |
          python3 - <<'PYCODE'
          import os,json,pathlib,subprocess
          files=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed_files.json').read_text())
          manifest=json.loads(pathlib.Path('docs/audits/PKG_0241_ASSET_PROVENANCE.json').read_text())
          files += [x['file'] for x in manifest['lena_cleanup']]+[x['path'] for x in manifest['vendor']]
          subprocess.run(['git','add','--']+files,check=True)
          temporary_paths=['.github/workflows/publish-art-ux-0241.yml']+['.github/audit-0241/patch.'+str(i) for i in range(4)]
          subprocess.run(['git','rm','--']+temporary_paths,check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(staged)==set(files+temporary_paths)
          subprocess.run(['git','config','user.name','Getting Strange audit'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','PKG-0241: repair graphics, animation, pause, text, focus and safe save actions'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/art-ux-audit-0241'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          print('PUBLISHED_REVIEWED_COMMIT',commit)
          PYCODE
  windows-verification:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /scenes/
            /resources/
            /assets/
            /docs/
            /tools/
            /tests/
            /reports/
            /.github/skills/README.md
      - name: Install verified Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'godot0241'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile "$bin/godot.zip"
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt' -OutFile "$bin/sums.txt"
          $line = Get-Content "$bin/sums.txt" | Where-Object { $_ -match 'Godot_v4.7.2-stable_win64.exe.zip$' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash "$bin/godot.zip" -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()) { throw 'Checksum mismatch' }
          Expand-Archive "$bin/godot.zip" "$bin/unpacked"
          Copy-Item "$bin/unpacked/Godot_v4.7.2-stable_win64.exe" "$bin/godot.exe"
          Copy-Item "$bin/unpacked/Godot_v4.7.2-stable_win64_console.exe" "$bin/godot_console.exe"
          $bin >> $env:GITHUB_PATH
      - name: Independent new gate, full verifier, documentation and snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = 'reports/pkg_0241/windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File "$out/commit.txt"
          & godot_console --headless --path . --audio-driver Dummy --editor --import *> "$out/import.log"
          $importCode = $LASTEXITCODE
          & godot_console --headless --path . --audio-driver Dummy --script res://tests/pkg_0241_visual_ux_test.gd *> "$out/regression.log"
          $newCode = $LASTEXITCODE
          & pwsh -NoProfile -File tools/verify.ps1 -AudioDriver Dummy *> "$out/verify.log"
          $fullCode = $LASTEXITCODE
          & pwsh -NoProfile -File tools/verify_docs.ps1 *> "$out/docs.log"
          $docsCode = $LASTEXITCODE
          & pwsh -NoProfile -File tools/snapshot.ps1 -Package PKG-0241 *> "$out/snapshot.log"
          $snapshotCode = $LASTEXITCODE
          $badLogs = @(Select-String -Path "$out/import.log","$out/regression.log" -Pattern 'SCRIPT ERROR|Parse Error|^ERROR:|^WARNING:|instances were leaked').Count -gt 0
          @{ import=$importCode; new_gate=$newCode; full_verifier=$fullCode; docs=$docsCode; snapshot=$snapshotCode; import_or_new_gate_log_error=[bool]$badLogs; audio_profile='Dummy: no physical audio validation' } | ConvertTo-Json | Out-File "$out/results.json"
          Get-Content "$out/results.json"
          Get-Content "$out/regression.log" -Tail 6
          Get-Content "$out/verify.log" -Tail 30
          if ($importCode -ne 0 -or $newCode -ne 0 -or $fullCode -ne 0 -or $docsCode -ne 0 -or $snapshotCode -ne 0 -or $badLogs) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-art-ux-0241
          path: reports/pkg_0241/windows/
          retention-days: 14
          if-no-files-found: error
