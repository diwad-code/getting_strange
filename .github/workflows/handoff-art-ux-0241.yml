name: Verify and publish audit handoff 0241
on:
  push:
    branches: [fix/art-ux-audit-0241]
    paths: [.github/workflows/handoff-art-ux-0241.yml]
permissions:
  contents: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /docs/
            /tools/
            /.github/audit-0241/
            /.github/workflows/
      - name: Apply seven source-guarded handoff additions and verify documentation
        run: |
          python3 - <<'PY'
          import os,json,pathlib,hashlib,subprocess
          assert os.environ['GITHUB_REF_NAME']=='fix/art-ux-audit-0241'
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==os.environ['GITHUB_SHA']
          operations=json.loads(pathlib.Path('.github/audit-0241/handoff.json').read_text())
          allowed={'AGENTS.md','docs/CURRENT_STATE.md','docs/NEXT_SESSION_PROMPT.md','docs/INDEX.md','docs/SESSION_LOG.md','docs/DECISION_LOG.md','docs/RISKS_AND_HYPOTHESES.md'}
          assert len(operations)==7 and {o['path'] for o in operations}==allowed
          originals={o['path']:pathlib.Path(o['path']).read_bytes() for o in operations}
          for o in operations:
              assert hashlib.sha256(originals[o['path']]).hexdigest()==o['sha256'],o['path']
              assert o['mode'] in ('prefix','append','after_title')
          for o in operations:
              data=originals[o['path']];text=o['text'].encode()
              if o['mode']=='append':result=data+b'\n'+text
              elif o['mode']=='prefix':result=text+data
              else:
                  title,rest=data.split(b'\n',1);result=title+b'\n'+text+b'\n'+rest
              pathlib.Path(o['path']).write_bytes(result)
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'handoff-docs-0241.log'
          with log.open('w') as output:
              checked=subprocess.run(['pwsh','-NoProfile','-File','tools/verify_docs.ps1'],stdout=output,stderr=subprocess.STDOUT)
          print(log.read_text())
          assert checked.returncode==0,'documentation gate failed'
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--']+sorted(allowed),check=True)
          temporary=['.github/workflows/handoff-art-ux-0241.yml','.github/audit-0241/handoff.json']
          subprocess.run(['git','rm','--']+temporary,check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert staged==allowed|set(temporary)
          subprocess.run(['git','config','user.name','Getting Strange audit'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','PKG-0241: verified current state, decisions, risks and next-session handoff'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/art-ux-audit-0241'],check=True)
          print('HANDOFF_COMMIT',subprocess.check_output(['git','rev-parse','HEAD']).decode().strip())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-docs-0241
          path: ${{ runner.temp }}/handoff-docs-0241.log
          if-no-files-found: warn
          retention-days: 14
